<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日常ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 20px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    .menu { display: flex; flex-direction: column; gap: 12px; }
    .menu a {
      display: block;
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: #1a1a1a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      font-size: 1.1rem;
      font-weight: 600;
    }
    .menu a:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .menu a span {
      display: block;
      font-size: 0.85rem;
      font-weight: 400;
      color: #6b7280;
      margin-top: 4px;
    }
    footer {
      text-align: center;
      padding: 24px;
      color: #6b7280;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>日常ツール</h1>
  </header>
  <main>
    <div class="menu">
      <a href="calculator.html">電卓<span>四則演算・％対応</span></a>
      <a href="notes.html">メモ<span>書いて保存。リロードしても残る</span></a>
      <a href="compare.html">単価比較<span>値段と数量から単価を出して比較</span></a>
    </div>
  </main>
  <footer>ローカル保存のみ / データはブラウザに残ります</footer>
</body>
</html>
